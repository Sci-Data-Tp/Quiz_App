<!DOCTYPE html>
<html>
<head>
    <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <style>
        body{
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }
    .container{
        max-width: 800px;
        margin: auto;
        background-color: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }
    h2 {
        text-align: center;
        color: #333;
    }

    .question {
        font-size: 22px;
        font-weight: bold;
        margin-top: 20px;
    }
    label {
        display: block;
        padding: 8px 0;
        font-size: 18px;
    }
    input[type="radio"] {
        transform: scale(1.3); 
        margin-right: 10px;
    }
    button {
        background-color: #4CAF50;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
    }
    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }
    .timer-box {
        background-color: #f44336;
        color: white;
        padding: 12px 18px;
        border-radius: 8px;
        text-align: center;
        font-weight: bold;
    }
    </style>
</head>
<body>
<div class="container">

<h2>Quiz: Probability and statistics</h2>

<div class="top-bar">
    <div class="student-info">
        <p>Name: {{ student_name }}</p>
        <p>Student ID: {{ student_id }}</p>
        <p>Department: {{ department }}</p>
    </div>

    <div class="timer-box">
        Time Left<br>
        <span id="time">30:00</span>
    </div>
</div>


<form action="/submit" method="post">

    <input type="hidden" name="student_name" value="{{ student_name }}">
    <input type="hidden" name="student_id" value="{{ student_id }}">
    <input type="hidden" name="department" value="{{ department }}">



{% for question in questions %}
    <p class="question">{{ loop.index }}. {{ question.question }}</p>
    {% for op in question.options %}
        <input type="radio" name="question_{{ question.id }}" value="{{ op }}" required> {{ op }}<br>
    {% endfor %}
    <br>
{% endfor %}

<button type="submit">Submit Quiz</button>



</form>
</div>
<script>
let timeLeft = {{ remaining_time }};

let timer = setInterval(function() {

    if (timeLeft <= 0) {

        clearInterval(timer);

        document.getElementById("time").innerHTML = "Time's up!";

        document.forms[0].submit();

    } else {

        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;

        document.getElementById("time").innerHTML =
            minutes + ":" + (seconds < 10 ? "0" : "") + seconds;

        timeLeft--;
    }

}, 1000);
</script>

<script>
    document.addEventListener("visibilitychange", function() {
        if (document.hidden) {
            alert("You have switched tabs or minimized the window. The quiz will be submitted automatically.");
            document.forms[0].submit(); // Automatically submit the form when the user switches tabs
        }
    });
</script>

<script>
history.pushState(null, "", location.href);

window.addEventListener("popstate", function () {
    history.pushState(null, "", location.href);
});
</script>

</body>
</html>
