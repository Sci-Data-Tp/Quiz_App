<!DOCTYPE html>
<html>  
<head>
    <title>Results</title>
</head>
<body>
    <h1>Quiz Result</h1>
    <table border="1">
        <tr>
            <th>Sr No.</th>
            <th>Name</th>
            <th>Student ID</th>
            <th>Department</th>
            <th>Score</th>
        </tr>

        {% for row in data %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
            <td>{{ row[4] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
